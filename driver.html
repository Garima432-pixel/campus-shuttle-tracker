<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale = 1.0 " />
    <title>Driver Console</title>
</head>

<body style="font-family: sans-serif; text-align: center; padding: 20px;">

    <h2>🚌 Driver GPS Console</h2>

    <!--Vehicle Selector-->
    <select id="shuttleSelect">
        <option value="MUST_BUS_01">MUST_BUS_01</option>
        <option value="MUST_BUS_02">MUST_BUS_02</option>
    </select>
    <br><br>

    <select id="directionSelect">
        <option value="outbound">Outbound (Main Gate → 15 Street / Ground)</option>
        <option value="inbound">Inbound (Return → Main Gate)</option>
    </select>
    <br><br>

    <!-- Action Button-->
    <button id="toggleBtn" onclick="toggleTracking()">Start Driving</button>

    <!-- Status Labels-->
    <p id="status">Status: Standby</p>
    <div id="log"></div>
    <script>


        let socket = null;
        let watchId = null;
        let isTracking = false;

        function toggleTracking() {
            if (!isTracking) {
                startTracking();
            }
            else {
                stopTracking();
            }
        }


        // we are here implementing different functions
        function startTracking() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser");
                return;
            }
            const successCallback = (position) => {

                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                let speed = (position.coords.speed || 0) * 3.6;

                const shuttleSelectElem = document.getElementById("shuttleSelect");
                const shuttle_id = shuttleSelectElem ? shuttleSelectElem.value : "MUST_BUS_01";
                const direction = document.getElementById("directionSelect").value;

                const payload = {
                    "shuttle_id": shuttle_id,
                    "Direction": direction,
                    "lat": latitude,
                    "lng": longitude,
                    "speed": Math.round(speed),
                    "name": "En Route",
                    "timestamp": Math.floor(Date.now() / 1000)
                };
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify(payload));
                    document.getElementById("log").textContent =
                        `Sent: [${payload.shuttle_id}] Lat: ${latitude.toFixed(5)}, Lng: ${longitude.toFixed(5)} | Speed: ${payload.speed} km/h`;
                }
            }
            const errorCallBack = (error) => {
                document.getElementById("status").textContent = "GPS Error:" + error.message;
            };

            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const socketUrl = `${protocol}//${window.location.host}/ws/shuttle`;
            socket = new WebSocket(socketUrl);

            socket.onopen = () => {
                isTracking = true;
                document.getElementById("status").textContent = "Status: Actively Streaming";
                watchId = navigator.geolocation.watchPosition(successCallback, errorCallBack, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                });
            };
            socket.onerror = (err) => {
                document.getElementById("status").textcontent = "Socket Error: Connection failed";
            };
            socket.onclose = () => {
                if (isTracking) {
                    stopTracking();
                }
            };
        }


        function stopTracking() {
            if (watchId != null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (socket) {
                socket.close();
                socket = null;
            }
            isTracking = false;
            document.getElementById("status").textContent = "Status: StandBy";
            document.getElementById("toggleBtn").textContent = "Start Driving";
        }

    </script>
</body>

</html>
